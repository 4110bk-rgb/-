<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Отчёты Bitrix24</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Отчёты Bitrix24</h1>
    <div style="display: flex; align-items: baseline; gap: 16px;">
      <span id="status">Загрузка…</span>
      <a id="export-link" href="/api/export.xlsx" download>Скачать Excel</a>
    </div>
  </header>

  <main>
    <section class="panel" id="deals-panel">
      <h2>Сделки</h2>
      <div id="deals-body">Загрузка…</div>
    </section>

    <section class="panel" id="leads-panel">
      <h2>Лиды</h2>
      <div id="leads-body">Загрузка…</div>
    </section>

    <section class="panel" id="calls-panel">
      <h2>Звонки</h2>
      <div id="calls-body">Загрузка…</div>
    </section>

    <section class="panel" id="efficiency-panel">
      <h2>Эффективность менеджеров</h2>
      <div id="efficiency-body">Загрузка…</div>
    </section>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
